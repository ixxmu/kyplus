# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_run:
    workflows: ["lint.yaml", "check.yaml"]
    types: [completed]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

concurrency:
  group: pkgdown-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  pkgdown:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    steps:
      - name: Gate on lint/check success for commit
        if: github.event_name == 'workflow_run'
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const required = ["lint.yaml", "check.yaml"];
            const results = {};

            for (const workflowId of required) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                event: "push",
                per_page: 100
              });
              const run = data.workflow_runs.find(r => r.head_sha === sha);
              results[workflowId] = run ? run.conclusion : null;
            }

            core.info(`Gate results for ${sha}: ${JSON.stringify(results)}`);
            const ready = required.every(id => results[id] === "success");
            core.setOutput("ready", ready ? "true" : "false");

      - name: Skip until lint/check both pass
        if: github.event_name == 'workflow_run' && steps.gate.outputs.ready != 'true'
        run: echo "Lint/check are not both successful for this SHA yet; skipping pkgdown."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: r-lib/actions/setup-pandoc@v2
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        with:
          extra-packages: any::pkgdown, any::BiocManager
          needs: website

      - name: Build site
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to Netlify 🚀
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.ready == 'true'
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=docs --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
